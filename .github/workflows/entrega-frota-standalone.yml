name: Validar, empacotar e publicar Frota
on:
  push:
    branches:
      - main
      - feat/frota-updater-main-20261014
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frota-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  standalone-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exato do commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolver versao do release sem sobrescrever tags
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseVersion = node -p "require('./package.json').version"
          $latestTag = ''
          $latestSha = ''
          $latest = gh api "repos/${{ github.repository }}/releases/latest" 2>$null
          if ($LASTEXITCODE -eq 0 -and $latest) {
            $release = $latest | ConvertFrom-Json
            $latestTag = [string]$release.tag_name
            $latestSha = [string]$release.target_commitish
          }
          $version = (node tooling/release-version.mjs $baseVersion $latestTag).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Versao invalida' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=frota-v$version" >> $env:GITHUB_ENV
          $isAlreadyReleased = ($latestSha -eq $env:GITHUB_SHA)
          "already_released=$($isAlreadyReleased.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Versao selecionada: $version; commit ja publicado: $isAlreadyReleased"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar importacoes, testes e compilacao web
        run: npm run check
      - name: Instalar Chromium Playwright
        run: npx playwright install chromium
      - name: QA funcional e visual completo
        shell: pwsh
        run: |
          npm run qa:surface
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run qa:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Evidencias de falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frota-playwright-diagnostics
          path: |
            test-results/
            qa-artifacts/playwright-report/
            qa-artifacts/phase5-summary.json
            qa-artifacts/playwright-summary.json
          retention-days: 7
          if-no-files-found: warn
      - name: Aplicar versao ao pacote compilado
        run: npm version $env:RELEASE_VERSION --no-git-tag-version --allow-same-version
        shell: pwsh
      - name: Preparar atualizador GitHub do proprio repositorio
        run: node tooling/prepare-update-build.mjs
      - name: Compilar instalador Windows NSIS
        run: npm run build:win
      - name: Validar instalador, latest.yml, blockmap e SHA-256
        shell: pwsh
        run: |
          $file = Get-ChildItem release -Filter 'ArtiSys-Frota-Setup-*.exe' -File | Select-Object -First 1
          if (-not $file) { throw 'Instalador ausente' }
          if ($file.Name -ne "ArtiSys-Frota-Setup-$env:RELEASE_VERSION.exe") { throw 'Versao do EXE inconsistente' }
          $stream = [IO.File]::OpenRead($file.FullName)
          try { $header = New-Object byte[] 2; [void]$stream.Read($header,0,2) } finally { $stream.Dispose() }
          if ($file.Length -lt 1000000 -or $header[0] -ne 77 -or $header[1] -ne 90) { throw 'EXE Windows invalido' }
          if (-not (Test-Path release/latest.yml)) { throw 'Manifest latest.yml ausente' }
          if (@(Get-ChildItem release -Filter '*.blockmap' -File).Count -eq 0) { throw 'NSIS blockmap ausente' }
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii release/SHA256SUMS.txt
          @{product='fleet-maintenance';version=$env:RELEASE_VERSION;commit=$env:GITHUB_SHA;filename=$file.Name;sha256=$hash;sizeBytes=$file.Length;tested='phase5';legacyDatabaseCertification='not-run-no-legacy-db'} | ConvertTo-Json | Set-Content -Encoding utf8 release/DELIVERY-MANIFEST.json
          Write-Host "Installer=$($file.Name); SHA256=$hash"
      - name: Salvar instalador e evidencias
        uses: actions/upload-artifact@v4
        with:
          name: ArtiSys-Frota-Standalone-Windows
          path: |
            release/ArtiSys-Frota-Setup-*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/DELIVERY-MANIFEST.json
            qa-artifacts/phase5-summary.json
            qa-artifacts/playwright-summary.json
          retention-days: 30
          if-no-files-found: error
      - name: Impedir publicacao de tags previamente existentes
        if: github.ref == 'refs/heads/main' && steps.version.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releasesJson = gh release list --json tagName --limit 100
          if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel consultar as releases existentes.' }
          $existing = @($releasesJson | ConvertFrom-Json | Where-Object { $_.tagName -eq $env:RELEASE_TAG })
          if ($existing.Count -gt 0) { throw "Release $env:RELEASE_TAG ja existe. Nao sobrescrever." }
      - name: Criar GitHub Release em rascunho
        if: github.ref == 'refs/heads/main' && steps.version.outputs.already_released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @((Get-ChildItem release -File | Where-Object { $_.Name -match '^ArtiSys-Frota-Setup-.*\.exe$|\.blockmap$|^latest\.yml$|^SHA256SUMS\.txt$|^DELIVERY-MANIFEST\.json$' }) | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --title "ArtiSys Frota $env:RELEASE_VERSION" --target $env:GITHUB_SHA --notes "Build Windows aprovado por testes e QA, com atualizacao estilo ArtiSys PDV." --draft
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar release draft' }
      - name: Sincronizar instalador com Google Drive
        if: github.ref == 'refs/heads/main' && steps.version.outputs.already_released != 'true'
        shell: pwsh
        env:
          FROTA_GDRIVE_RCLONE_CONFIG: ${{ secrets.FROTA_GDRIVE_RCLONE_CONFIG }}
        run: |
          if (-not $env:FROTA_GDRIVE_RCLONE_CONFIG) {
            Write-Host 'Drive opcional nao configurado. GitHub Releases continua gratuito e funcional.'
            exit 0
          }
          choco install rclone -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Nao foi possivel instalar rclone' }
          $config = Join-Path $env:RUNNER_TEMP 'frota-rclone.conf'
          [IO.File]::WriteAllText($config,$env:FROTA_GDRIVE_RCLONE_CONFIG)
          $remote = 'artisys-qa-drive'
          $rootId = '1hv_RUXwq_C1Z5Pw9M0xX9cJjzJY8arhZ'
          $installer = (Get-ChildItem release -Filter 'ArtiSys-Frota-Setup-*.exe' | Select-Object -First 1)
          if (-not $installer) { throw 'EXE nao localizado para o Drive' }
          $flags = @('--config',$config,'--drive-root-folder-id',$rootId)
          rclone lsf "${remote}:" @flags
          if ($LASTEXITCODE -ne 0) { throw 'Configuracao do Drive invalida' }
          rclone mkdir "${remote}:anterior" @flags
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar historico' }
          rclone copyto $installer.FullName "${remote}:$($installer.Name)" @flags
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao enviar EXE ao Drive' }
          rclone check (Split-Path $installer.FullName -Parent) "${remote}:" @flags --include $installer.Name --one-way
          if ($LASTEXITCODE -ne 0) { throw 'Hash/arquivo nao confere no Drive' }
          Write-Host "Drive sincronizado: $($installer.Name)"
      - name: Publicar GitHub Release para o updater
        if: github.ref == 'refs/heads/main' && steps.version.outputs.already_released != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar GitHub Release' }
          Write-Host "Release $env:RELEASE_TAG publicada apos QA e sincronizacao opcional do Drive."
