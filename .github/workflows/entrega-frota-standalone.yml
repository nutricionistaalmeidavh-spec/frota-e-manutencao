name: Validar e empacotar Frota independente
on:
  push:
    branches: [release/frota-standalone-20261014, feat/frota-update-pdv-pattern-20261014]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: frota-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  standalone-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolver versao automatica de release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = node -p "require('./package.json').version"
          $latestTag = ''
          if ($env:GITHUB_REF -eq 'refs/heads/release/frota-standalone-20261014') {
            $raw = & gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=30"
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao verificar versoes publicadas no GitHub.' }
            $releases = $raw | ConvertFrom-Json
            $previous = $releases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^frota-v\d+\.\d+\.\d+$' } | Select-Object -First 1
            if ($previous) { $latestTag = [string]$previous.tag_name }
          }
          $version = (node tooling/release-version.mjs $base $latestTag).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw 'Versao de release invalida' }
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar a versao' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versao validada: $version"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar importacoes, testes, compilacao
        run: npm run check
      - name: Preparar Chromium Playwright
        run: npx playwright install chromium
      - name: QA funcional e visual completo
        run: |
          npm run qa:surface
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run qa:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Evidencias de falha Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frota-playwright-diagnostics
          path: |
            test-results/
            qa-artifacts/playwright-report/
            qa-artifacts/phase5-summary.json
            qa-artifacts/playwright-summary.json
          retention-days: 3
          if-no-files-found: warn
      - name: Preparar build com GitHub Releases publico
        run: node tooling/prepare-update-build.mjs
      - name: Gerar instalador standalone NSIS
        run: npm run build:win
      - name: Validar instalador, latest.yml e hash
        shell: pwsh
        run: |
          $file = Get-ChildItem release -Filter 'ArtiSys-Frota-Setup-*.exe' -File | Select-Object -First 1
          if (-not $file) { throw 'Instalador nao encontrado' }
          if (-not (Test-Path release/latest.yml)) { throw 'latest.yml nao gerado' }
          if (-not (Get-ChildItem release -Filter '*.blockmap')) { throw 'NSIS blockmap nao gerado' }
          $stream = [IO.File]::OpenRead($file.FullName)
          try { $header = New-Object byte[] 2; [void]$stream.Read($header,0,2) }
          finally { $stream.Dispose() }
          if ($file.Length -lt 1000000 -or $header[0] -ne 77 -or $header[1] -ne 90) { throw 'EXE invalido' }
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii release/SHA256SUMS.txt
          $manifest = @{product='fleet-maintenance';repository=$env:GITHUB_REPOSITORY;commit=$env:GITHUB_SHA;version=(node -p "require('./package.json').version");file=$file.Name;sizeBytes=$file.Length;sha256=$hash;tested='phase5';updateProvider='github';legacyDatabaseCertification='not-run-no-legacy-db'} | ConvertTo-Json
          $manifest | Set-Content -Encoding utf8 release/DELIVERY-MANIFEST.json
          Write-Host "INSTALLER=$($file.Name) SIZE=$($file.Length) SHA256=$hash"
      - name: Enviar instalador e evidencias
        uses: actions/upload-artifact@v4
        with:
          name: ArtiSys-Frota-Standalone-Windows
          path: |
            release/ArtiSys-Frota-Setup-*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/DELIVERY-MANIFEST.json
            qa-artifacts/phase5-summary.json
            qa-artifacts/playwright-summary.json
          retention-days: 30
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/release/frota-standalone-20261014' && github.event_name == 'push'
    needs: standalone-windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ArtiSys-Frota-Standalone-Windows
          path: release-assets
      - name: Conferir artefatos do mesmo commit
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.standalone-windows.outputs.version }}"
          test -n "$VERSION"
          test -s release-assets/latest.yml
          test -s release-assets/SHA256SUMS.txt
          test -s release-assets/DELIVERY-MANIFEST.json
          test "$(find release-assets -maxdepth 1 -name 'ArtiSys-Frota-Setup-*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.blockmap' | wc -l)" -ge 1
          grep -Fq "ArtiSys-Frota-Setup-${VERSION}.exe" release-assets/SHA256SUMS.txt
          sha256sum -c release-assets/SHA256SUMS.txt --ignore-missing
          jq -e --arg sha "$GITHUB_SHA" --arg version "$VERSION" '.commit == $sha and .version == $version and .updateProvider == "github"' release-assets/DELIVERY-MANIFEST.json
      - name: Sincronizar instalador com Google Drive (opcional)
        shell: bash
        env:
          FROTA_GDRIVE_RCLONE_CONFIG: ${{ secrets.FROTA_GDRIVE_RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${FROTA_GDRIVE_RCLONE_CONFIG:-}" ]]; then
            echo "::notice::Sincronizacao com Drive desabilitada: configurar FROTA_GDRIVE_RCLONE_CONFIG somente se desejado."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          CONF="$RUNNER_TEMP/frota-rclone.conf"
          printf '%s' "$FROTA_GDRIVE_RCLONE_CONFIG" > "$CONF"
          chmod 600 "$CONF"
          REMOTE='artisys-qa-drive'
          ROOT='1hv_RUXwq_C1Z5Pw9M0xX9cJjzJY8arhZ'
          FLAGS=(--config "$CONF" --drive-root-folder-id "$ROOT")
          rclone listremotes --config "$CONF" | grep -Fx "${REMOTE}:"
          FILE="$(find release-assets -maxdepth 1 -name 'ArtiSys-Frota-Setup-*.exe' -print -quit)"
          VERSION="${{ needs.standalone-windows.outputs.version }}"
          STAGE=".frota-release-staging/${VERSION}-${GITHUB_RUN_ID}"
          rclone mkdir "${REMOTE}:Anterior" "${FLAGS[@]}"
          rclone copyto "$FILE" "${REMOTE}:${STAGE}/$(basename "$FILE")" "${FLAGS[@]" --checksum
          rclone check "$(dirname "$FILE")" "${REMOTE}:${STAGE}" "${FLAGS[@]}" --include "$(basename "$FILE")" --one-way
          rclone copyto "$FILE" "${REMOTE}:ArtiSys-Frota-Setup-Windows.exe" "${FLAGS[@]}" --checksum
          rclone check "$(dirname "$FILE")" "${REMOTE}:" "${FLAGS[@]}" --include "ArtiSys-Frota-Setup-Windows.exe" --one-way --size-only
          rclone purge "${REMOTE}:${STAGE}" "${FLAGS[@]}" || true
          echo "Drive: ArtiSys-Frota-Setup-Windows.exe sincronizado."
      - name: Publicar GitHub Release para o updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="frota-v${{ needs.standalone-windows.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release $TAG ja existe. Nao sobrescrever versoes publicadas."
            exit 1
          fi
          gh release create "$TAG" release-assets/ArtiSys-Frota-Setup-*.exe release-assets/*.blockmap release-assets/latest.yml release-assets/SHA256SUMS.txt release-assets/DELIVERY-MANIFEST.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ArtiSys Frota ${{ needs.standalone-windows.outputs.version }}" \
            --notes "Build Windows validado por testes, QA funcional/visual, metadados de update e SHA-256. Atualizacao sob comando do operador, backup local antes da instalacao." --latest
