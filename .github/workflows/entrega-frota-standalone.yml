name: Validar e empacotar Frota independente
on:
  push:
    branches: [release/frota-standalone-20261014]
    tags: ['frota-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  standalone-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar tag da versao
        if: startsWith(github.ref, 'refs/tags/frota-v')
        shell: pwsh
        run: |
          $expected = "frota-v$(node -p "require('./package.json').version")"
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag incorreta: esperado $expected" }
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar importacoes, testes, compilacao
        run: npm run check
      - name: Preparar Chromium Playwright
        run: npx playwright install chromium
      - name: QA funcional e visual completo
        run: |
          npm run qa:surface
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run qa:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Evidencias de falha Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frota-playwright-diagnostics
          path: |
            test-results/
            qa-artifacts/playwright-report/
            qa-artifacts/phase5-summary.json
            qa-artifacts/playwright-summary.json
          retention-days: 3
          if-no-files-found: warn
      - name: Preparar build e canal de atualizacoes
        env:
          FROTA_UPDATE_FEED_URL: ${{ vars.FROTA_UPDATE_FEED_URL }}
        run: node tooling/prepare-update-build.mjs
      - name: Gerar instalador standalone NSIS
        run: npm run build:win
      - name: Gerar manifest e validar instalador e updater
        shell: pwsh
        env:
          FROTA_UPDATE_FEED_URL: ${{ vars.FROTA_UPDATE_FEED_URL }}
        run: |
          $file = Get-ChildItem release -Filter 'ArtiSys-Frota-Setup-*.exe' -File | Select-Object -First 1
          if (-not $file) { throw 'Instalador nao encontrado' }
          $stream = [IO.File]::OpenRead($file.FullName)
          try { $header = New-Object byte[] 2; [void]$stream.Read($header,0,2) }
          finally { $stream.Dispose() }
          if ($file.Length -lt 1000000 -or $header[0] -ne 77 -or $header[1] -ne 90) { throw 'EXE invalido' }
          if ($env:FROTA_UPDATE_FEED_URL) {
            if (-not (Test-Path release/latest.yml)) { throw 'latest.yml nao gerado para canal de atualizacao' }
            if (-not (Get-ChildItem release -Filter '*.blockmap')) { throw 'NSIS blockmap nao gerado' }
          }
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -Encoding ascii release/SHA256SUMS.txt
          $manifest = @{product='fleet-maintenance';repository='frota-e-manutencao';ref=$env:GITHUB_SHA;version=(node -p "require('./package.json').version");file=$file.Name;sizeBytes=$file.Length;sha256=$hash;tested='phase5';feedConfigured=[bool]$env:FROTA_UPDATE_FEED_URL;legacyDatabaseCertification='not-run-no-legacy-db'} | ConvertTo-Json
          $manifest | Set-Content -Encoding utf8 release/DELIVERY-MANIFEST.json
          Write-Host "INSTALLER=$($file.Name) SIZE=$($file.Length) SHA256=$hash"
      - name: Enviar instalador com hash e resultados
        uses: actions/upload-artifact@v4
        with:
          name: ArtiSys-Frota-Standalone-Windows
          path: |
            release/ArtiSys-Frota-Setup-*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/DELIVERY-MANIFEST.json
            qa-artifacts/phase5-summary.json
            qa-artifacts/playwright-summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Publicar em servidor proprio no lancamento por tag
        if: startsWith(github.ref, 'refs/tags/frota-v')
        shell: pwsh
        env:
          FROTA_UPDATE_FEED_URL: ${{ vars.FROTA_UPDATE_FEED_URL }}
          FROTA_SSH_HOST: ${{ secrets.FROTA_SSH_HOST }}
          FROTA_SSH_USER: ${{ secrets.FROTA_SSH_USER }}
          FROTA_SSH_PATH: ${{ secrets.FROTA_SSH_PATH }}
          FROTA_SSH_PRIVATE_KEY: ${{ secrets.FROTA_SSH_PRIVATE_KEY }}
          FROTA_SSH_KNOWN_HOSTS: ${{ secrets.FROTA_SSH_KNOWN_HOSTS }}
        run: |
          if (-not $env:FROTA_UPDATE_FEED_URL) { throw 'Defina FROTA_UPDATE_FEED_URL antes de publicar uma tag' }
          foreach ($key in @('FROTA_SSH_HOST','FROTA_SSH_USER','FROTA_SSH_PATH','FROTA_SSH_PRIVATE_KEY','FROTA_SSH_KNOWN_HOSTS')) {
            if (-not [Environment]::GetEnvironmentVariable($key)) { throw "Secret ausente: $key" }
          }
          if ($env:FROTA_SSH_HOST -notmatch '^[A-Za-z0-9.-]+$' -or $env:FROTA_SSH_USER -notmatch '^[A-Za-z0-9_-]+$' -or $env:FROTA_SSH_PATH -notmatch '^/[A-Za-z0-9/_-]+$') { throw 'Host, usuario ou caminho SSH invalidos' }
          $dir = Join-Path $env:RUNNER_TEMP 'frota-ssh'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $keyFile = Join-Path $dir 'id_ed25519'
          $knownFile = Join-Path $dir 'known_hosts'
          [IO.File]::WriteAllText($keyFile,($env:FROTA_SSH_PRIVATE_KEY -replace '\\n',"`n"))
          [IO.File]::WriteAllText($knownFile,$env:FROTA_SSH_KNOWN_HOSTS)
          $remote = "$($env:FROTA_SSH_USER)@$($env:FROTA_SSH_HOST):$($env:FROTA_SSH_PATH)"
          $opts = @('-i',$keyFile,'-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$knownFile")
          foreach ($file in @(Get-ChildItem release -File | Where-Object { $_.Name -like 'ArtiSys-Frota-Setup-*.exe' -or $_.Name -like '*.blockmap' })) {
            & scp @opts $file.FullName "$remote/"
            if ($LASTEXITCODE -ne 0) { throw "Falha no envio $($file.Name)" }
          }
          & scp @opts release/latest.yml "$remote/latest.yml.pending"
          if ($LASTEXITCODE -ne 0) { throw 'Falha no upload do manifesto' }
          & ssh @opts "$($env:FROTA_SSH_USER)@$($env:FROTA_SSH_HOST)" "mv $($env:FROTA_SSH_PATH)/latest.yml.pending $($env:FROTA_SSH_PATH)/latest.yml"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao ativar o manifesto' }
      - name: Criar GitHub Release interna apos publicacao
        if: startsWith(github.ref, 'refs/tags/frota-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem release -File | Where-Object { $_.Name -like 'ArtiSys-Frota-Setup-*.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' -or $_.Name -eq 'SHA256SUMS.txt' })
          & gh release create $env:GITHUB_REF_NAME @($files | ForEach-Object FullName) --title "ArtiSys Frota $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
